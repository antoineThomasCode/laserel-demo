<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laserel - Bientôt disponible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f0e8;
      font-family: 'Josefin Sans', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      animation: fadeIn 1.2s ease-out;
    }

    .logo {
      width: 120px;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .diamond {
      font-size: 2rem;
      color: #c9a96e;
      margin-bottom: 1.5rem;
      animation: pulse 3s ease-in-out infinite;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: #f5f0e8;
    }

    .gold {
      color: #c9a96e;
    }

    p {
      font-size: 1.1rem;
      font-weight: 300;
      color: rgba(245, 240, 232, 0.6);
      line-height: 1.6;
    }

    .line {
      width: 60px;
      height: 1px;
      background: #c9a96e;
      margin: 2rem auto;
      opacity: 0.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo-laserel.png" alt="Laserel" class="logo">
    <div class="diamond">&#9671;</div>
    <h1>Votre offre sera disponible <span class="gold">bientôt</span></h1>
    <div class="line"></div>
    <p>Nous preparons quelque chose de special pour vous.</p>
  </div>
</body>
</html>
